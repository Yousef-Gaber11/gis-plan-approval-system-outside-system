<!doctype html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>اعتماد مخططات الإسكان خارج النظام</title>

    <script src="https://cdn.jsdelivr.net/npm/json-formatter-js@2.3.4/dist/json-formatter.umd.min.js"></script>

    <!-- <script src="https://unpkg.com/shpjs@latest/dist/shp.js"></script> -->

    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.28/"></script>

    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div id="sidebar">
        <h2>اعتماد المخطط</h2>

        <div class="context-panel">
            <h4>1. تحديد النطاق الأساسي</h4>

            <div class="radio-group">
                <label class="radio-label">
                    <input type="radio" name="pathType" id="radioMuni" checked> حدود بلدية
                </label>
                <label class="radio-label">
                    <input type="radio" name="pathType" id="radioDecision"> قرار مساحي
                </label>
            </div>

            <div class="input-group">
                <input type="text" id="inputMuniCode" class="context-input" value="011001001"
                    placeholder="أدخل كود البلدية">

                <input type="text" id="inputKrokino" class="context-input" value="43013394328"
                    placeholder="أدخل رقم الكروكي" style="display: none;">

                <button id="fetchContextBtn">جلب ورسم</button>
            </div>
        </div>

        <div class="upload-section disabled" id="uploadSectionDiv">
            <h4>2. مطابقة المخطط (Shapefile)</h4>
            <label for="shpFileInput" class="custom-file-upload" id="uploadLabel">اختيار ملف المخطط (.zip)</label>
            <input type="file" id="shpFileInput" accept=".zip" disabled />
            <small class="upload-note">سيتم تفعيل الرفع بعد جلب النطاق بنجاح</small>
        </div>

        <hr class="divider" />

        <h3>مخرجات الإحصائيات (Statistics JSON)</h3>
        <div id="jsonViewer" dir="ltr">في انتظار رفع ملف المخطط</div>

        <hr />

        <h3>نتائج التحقق المكاني (الوضع المتري)</h3>
        <div id="validationViewer" dir="ltr"
            style="background-color: #f1f8ff; padding: 15px; border-radius: 6px; border: 1px solid #cce5ff; font-family: Consolas, monospace; font-size: 14px; margin-top: 10px;">
            في انتظار المعالجة المكانية
        </div>
    </div>

    <div id="viewDiv"></div>

    <script type="module" src="./js/main.js"></script>
</body>

</html>
